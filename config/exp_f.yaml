experiment:
  name: exp_f
  seed: 42
model:
  pretrained_model_name: distilbert-base-uncased
  classifier_head:
    type: mlp
    hidden_layers:
    - 256
    activation: silu
    dropout: 0.1
data:
  max_length: 128
training:
  output_dir: ./results/exp_f
  num_train_epochs: 5
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 1.0e-05
  weight_decay: 0.01
  warmup_steps: 500
  lr_scheduler_type: cosine
  save_strategy: steps
  save_steps: 100
  save_total_limit: 2
  eval_strategy: steps
  eval_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: accuracy
  greater_is_better: true
  fp16: true
  logging_dir: ./logs
  logging_strategy: steps
  logging_steps: 20
  report_to: wandb
  wandb_project: Fine-tuning-and-Optimizing-DistilBERT-for-Sentiment-Classification